default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check app migrations scripts tests
        language: system
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run --locked bandit -c pyproject.toml -r app scripts
        language: system
        pass_filenames: false
      - id: commitizen
        name: commitizen message
        entry: uv run --locked cz check --commit-msg-file
        language: system
        stages: [commit-msg]
      - id: unit-tests
        name: unit tests
        entry: uv run --locked python scripts/run_unit_tests.py
        language: system
        pass_filenames: false
        stages: [pre-push]
