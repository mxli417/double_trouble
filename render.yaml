services:
  - type: web
    name: doppelganger
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doppelganger-db
          property: connectionString
      - key: MATCHING_ENABLED
        value: "true"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: FACE_PROVIDER
        value: app.opencv_provider:create_provider
      - key: FACE_MODEL_PATH
        value: /app/models
      - key: FACE_EMBEDDING_DIM
        value: "128"
      - key: FACE_MODEL_VERSION
        value: yunet-2023mar+sface-2021dec
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_HOURS
        value: "8"
      - key: INVITE_HOURS
        value: "24"
      - key: INFERENCE_RETENTION_DAYS
        value: "30"
      - key: INFERENCE_DAILY_LIMIT
        value: "100"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_IMAGE_PIXELS
        value: "40000000"
      - key: IMAGE_MAX_SIDE
        value: "1600"
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com
      - key: DEPLOYMENT_ENVIRONMENT
        value: production
      - key: EXPERIMENT_VARIANT
        value: control
      - key: LOG_LEVEL
        value: INFO
      - key: SELF_SIMILARITY_THRESHOLD
        value: "0.55"
      - key: CONSENTED_STORAGE_ENABLED
        value: "true"
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: DATA_ENCRYPTION_KEY_VERSION
        value: v1
      - key: RETAINED_UPLOAD_DAYS
        value: "30"
      - key: RETAINED_IMAGE_MAX_SIDE
        value: "1024"
      - key: CONSENT_TEXT_VERSION
        value: "2026-11-05"
      - key: MATCH_NARRATION_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_TIMEOUT_SECONDS
        value: "12"
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_SECRET
        sync: false

databases:
  - name: doppelganger-db
    plan: free
    databaseName: doppelganger
    user: doppelganger
    postgresMajorVersion: "16"
    ipAllowList: []
