[project]
name = "double-trouble"
version = "0.1.0"
description = "Invite-only face-matching party app and CPU-only ML deployment blueprint"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "opencv-python-headless>=4.10,<5",
  "openai>=2,<3",
  "pgvector>=0.3,<1",
  "pillow>=10.4,<14",
  "pillow-heif>=0.18,<2",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "slowapi>=0.1.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "bandit[toml]>=1.9.4,<2",
  "commitizen>=4.19.3,<5",
  "httpx2>=2.13,<3",
  "pre-commit>=4.7,<5",
  "ruff>=0.17.3,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = []

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
major_version_zero = true
