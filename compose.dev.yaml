name: double-trouble-dev

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: double_trouble_dev
      POSTGRES_USER: double_trouble
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-double-trouble-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U double_trouble -d double_trouble_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - dev-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://double_trouble:${POSTGRES_PASSWORD:-double-trouble-dev-only}@db:5432/double_trouble_dev
      MATCHING_ENABLED: "true"
      RUN_MIGRATIONS_ON_START: "true"
      FACE_PROVIDER: app.opencv_provider:create_provider
      FACE_MODEL_PATH: /app/models
      FACE_EMBEDDING_DIM: "128"
      FACE_MODEL_VERSION: yunet-2023mar+sface-2021dec
      GALLERY_REQUIRED: "true"
      GALLERY_BUNDLE_PATH: /app/gallery/lfw-sface.jsonl.gz
      GALLERY_BUNDLE_SHA256: 70b441d5a226dd1c24caf7a9abd69b5650d249f07ef91088ac63b5c59716c2ff
      SESSION_COOKIE_SECURE: "false"
      SESSION_HOURS: "8"
      INVITE_HOURS: "24"
      INFERENCE_RETENTION_DAYS: "30"
      INFERENCE_DAILY_LIMIT: "100"
      MAX_UPLOAD_BYTES: "10485760"
      MAX_IMAGE_PIXELS: "40000000"
      IMAGE_MAX_SIDE: "1600"
      ALLOWED_HOSTS: localhost,127.0.0.1
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-dev-only-bootstrap-secret-change-me}
      DEPLOYMENT_ENVIRONMENT: development
      EXPERIMENT_VARIANT: ${EXPERIMENT_VARIANT:-control}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SELF_SIMILARITY_THRESHOLD: ${SELF_SIMILARITY_THRESHOLD:-0.55}
      CONSENTED_STORAGE_ENABLED: "true"
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-ZGV2LW9ubHktZG91YmxlLXRyb3VibGUta2V5LTAwMDE=}
      DATA_ENCRYPTION_KEY_VERSION: v1
      RETAINED_UPLOAD_DAYS: "30"
      RETAINED_IMAGE_MAX_SIDE: "1024"
      CONSENT_TEXT_VERSION: "2026-11-06"
      MATCH_NARRATION_ENABLED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_TIMEOUT_SECONDS: "12"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  dev-postgres:
