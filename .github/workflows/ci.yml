name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run --locked pre-commit validate-config
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      - run: uv run --locked python -m compileall -q app migrations scripts
      - run: uv run --locked python scripts/run_unit_tests.py
      - run: docker compose -f compose.dev.yaml config --quiet
      - run: cp .env.staging.example .env.staging
      - run: docker compose --env-file .env.staging -f compose.staging.yaml config --quiet
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        run: docker build -t double-trouble:${{ github.sha }} .
